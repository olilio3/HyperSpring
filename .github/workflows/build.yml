# Compilación automática: en cada push y en cada pull request se compila HyperSpring con
# local-build/build.sh (el mismo camino que las releases) y se suben los dos APK como artefacto.
# Sirve para ver errores antes de publicar. Las releases se siguen firmando aparte: estos APK
# llevan la clave de depuración de uber-apk-signer, como las publicadas.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TOOLS: ${{ github.workspace }}/.tools
      JADX_VERSION: "1.5.1"
      APKTOOL_VERSION: "2.10.0"
      SIGNER_VERSION: "1.3.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Las herramientas cambian poco: se guardan en caché entre compilaciones.
      - name: Caché de herramientas
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ env.JADX_VERSION }}-${{ env.APKTOOL_VERSION }}-${{ env.SIGNER_VERSION }}-api35

      - name: Descargar herramientas
        run: |
          mkdir -p "$TOOLS"
          cd "$TOOLS"
          [ -f android.jar ] || curl -fsSL -o android.jar \
            https://raw.githubusercontent.com/Sable/android-platforms/master/android-35/android.jar
          if [ ! -d jadx ]; then
            curl -fsSL -o jadx.zip "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
            unzip -q jadx.zip -d jadx && rm jadx.zip
          fi
          [ -f apktool.jar ] || curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          [ -f uber-apk-signer.jar ] || curl -fsSL -o uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v${SIGNER_VERSION}/uber-apk-signer-${SIGNER_VERSION}.jar"
          ls -la "$TOOLS"

      # build.sh revisa los shaders AGSL si encuentra skia-python y el script en $TOOLS.
      - name: Comprobador de shaders AGSL
        run: |
          sudo apt-get install -y -qq libegl1 libgl1 > /dev/null
          pip install --quiet skia-python
          cp local-build/agsl_check.py "$TOOLS/agsl_check.py"

      - name: Compilar
        run: bash local-build/build.sh

      - name: Subir los APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperSpring-${{ github.sha }}
          path: |
            local-build/out/HyperSpring.apk
            local-build/out/HyperSpring-legacy.apk
          if-no-files-found: error
